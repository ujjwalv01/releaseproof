name: Website

# Builds the website (website/build.mjs) from docs/ and the root Markdown, and deploys it to
# GitHub Pages from main. Pull requests only build it, so a broken link fails before merge;
# nothing from a pull request reaches the deploy job.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "packages/cli/CHANGELOG.md"
      - "packages/cli/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "packages/cli/CHANGELOG.md"
      - "packages/cli/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # No dependency cache on purpose, as in ci.yml.
      - name: Enable pnpm via Corepack
        run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Install the website's dependencies only
        run: pnpm install --frozen-lockfile --filter @releaseproof/website

      - name: Build (fails on a broken link or anchor)
        run: pnpm --filter @releaseproof/website build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only what a Pages deployment needs; no access to the repository contents.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
