name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code. No secrets are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-node:
    name: Minimum supported Node (22.12.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable pnpm via Corepack
        run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0

      # Keep package-manager launchers out of the minimum-runtime check. This is
      # the same Vitest invocation as "pnpm test", using the Node selected above.
      - name: Unit tests on minimum Node
        run: node node_modules/vitest/vitest.mjs run
      - name: Smoke test CLI on minimum Node
        run: node packages/cli/dist/index.js --version

  check:
    name: Lint, typecheck, build, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      # Actions are pinned to full commit SHAs: a tag can be moved, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      # pnpm version comes from "packageManager" in package.json.
      # No dependency cache on purpose: a poisoned cache was part of the TanStack attack.
      - name: Enable pnpm via Corepack
        run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Smoke test CLI
        run: node packages/cli/dist/index.js --version
      # The CLI is published from a pnpm-packed tarball (see release.yml). Catch a manifest
      # that would ship pnpm-only specifiers before it ever reaches the registry.
      - name: "Packed manifest must not contain catalog:/workspace: specifiers"
        working-directory: packages/cli
        run: |
          pnpm pack --pack-destination /tmp/pack
          tar -xzOf /tmp/pack/releaseproof-*.tgz package/package.json
          if tar -xzOf /tmp/pack/releaseproof-*.tgz package/package.json | grep -qE '"(catalog|workspace):'; then
            echo "::error::the packed package.json contains catalog:/workspace: specifiers"
            exit 1
          fi
      # The action runs from its committed bundle; a stale one would ship old code.
      - name: Action bundle must be committed up to date
        run: |
          if ! git diff --exit-code --stat -- action/dist; then
            echo "::error::action/dist is stale: run 'pnpm build' and commit action/dist"
            exit 1
          fi

  check-windows:
    name: Windows unit tests (Node 24)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable pnpm via Corepack
        run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
