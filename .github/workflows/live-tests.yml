name: Live tests

# Early warning for changes in npm, Sigstore or Docker images: runs the opt-in tests that
# talk to the real registry, the real Sigstore trust root and real Docker rebuilds.
# Weekly, and on demand.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Network and Docker tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Enable pnpm via Corepack
        run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - run: pnpm install --frozen-lockfile

      - name: Real registry and Sigstore verification
        run: pnpm vitest run packages/core/src/provenance/verify.network.test.ts
        env:
          RELEASEPROOF_NET_TESTS: "1"

      - name: Real Docker rebuilds
        run: pnpm vitest run packages/core/src/rebuild/run.docker.test.ts
        env:
          RELEASEPROOF_DOCKER_TESTS: "1"

  report-failure:
    name: Report scheduled live test failures
    runs-on: ubuntu-latest
    needs: live
    if: failure() && github.event_name == 'schedule'
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          issue_number="$(gh issue list --state open --search 'in:title "Live tests failing"' --limit 100 --json number,title --jq '[.[] | select(.title == "Live tests failing")][0].number // empty')"
          body="$(printf 'The scheduled live tests failed.\n\nRun: %s/%s/actions/runs/%s' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"

          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$body"
          else
            gh issue create --title "Live tests failing" --body "$body"
          fi
